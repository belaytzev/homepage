---
# Сборка образа форка для домашнего кластера.
#
# Штатный docker-publish.yml на форках не работает: там стоит
# `if: github.repository == 'gethomepage/homepage'`. Этот workflow живёт
# только в ветке lab и в PR в апстрим не попадает — ветка remnawave-v1.13.2
# остаётся чистой, с одним коммитом виджета.
#
# Собирается только linux/amd64: обе ноды кластера на нём, вторая
# платформа удвоила бы время сборки без пользы.
name: Fork image

on:
  push:
    branches: [lab]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # CI не передаём: тогда Dockerfile собирает приложение сам,
          # и в workflow не нужен отдельный шаг с pnpm
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
